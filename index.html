<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — To Be Soon</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0b1717;
      color: white;
      font-family: system-ui, sans-serif;
    }

    img {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    p {
      position: relative;
      margin: 0;
      padding: 0.25em 0.5em;
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 700;
      text-shadow: 0 2px 18px #000;
    }
  </style>
</head>
<body>
  <img src="image.png" alt="">
  <p>404 to be soon</p>
</body>
</html>
